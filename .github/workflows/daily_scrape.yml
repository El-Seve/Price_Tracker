name: Captura diaria de precios

on:
  schedule:
    # 09:00 hora Perú (UTC-5) = 14:00 UTC. Ajusta si quieres otra hora.
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions en GitHub

jobs:
  captura:
    runs-on: ubuntu-latest
    env:
      # El runner de GitHub Actions corre en UTC por defecto. Sin esto, una
      # corrida de noche hora Perú (ej. 9pm) ya cae en el día SIGUIENTE en
      # UTC -- tanto el nombre del CSV como la fecha guardada en precios.db
      # (Python usa la hora del sistema) quedaban desfasados un día.
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador (Playwright, para Ripley)
        run: playwright install --with-deps chromium

      - name: Correr captura
        run: python run.py --export-csv data/captura_$(date +%Y-%m-%d).csv

      - name: Generar datos del dashboard
        run: python -m dashboard.build_dashboard_data

      - name: Guardar cambios (base de datos + CSV del día + dashboard)
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/dashboard_data.json
          git diff --cached --quiet || git commit -m "Captura de precios $(date +%Y-%m-%d)"
          git push
